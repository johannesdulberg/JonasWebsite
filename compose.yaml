# Aufbau wie später auf dem Server: nginx -> gunicorn (Wagtail) -> Postgres.
# Start nur mit dieser Datei:  docker compose -f compose.yaml up --build
# (Ohne -f lädt Docker zusätzlich compose.override.yaml, das ist die Entwicklungsvariante.)

services:
  db:
    image: postgres:17
    restart: unless-stopped
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_files:/app/static
      - media_files:/app/media

  nginx:
    image: nginx:1.28
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/srv/static:ro
      - media_files:/srv/media:ro

# Volumes überleben das Neubauen der Container. db_data und media_files gehören ins Backup.
volumes:
  db_data:
  static_files:
  media_files:
