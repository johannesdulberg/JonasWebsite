# Entwicklungsvariante, wird von "docker compose up" automatisch dazugeladen.
# Der Code-Ordner ist in den Container eingehängt, Änderungen wirken sofort.
# Seite: http://localhost:8000

services:
  web:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  # Baut das CSS bei jeder Änderung an Templates oder an tailwind.css neu.
  tailwind:
    build: .
    entrypoint: []
    command: tailwindcss -i config/static_src/tailwind.css -o config/static/css/tailwind.css --watch=always
    volumes:
      - .:/app

  # nginx wird in der Entwicklung nicht gebraucht.
  nginx:
    profiles: ["nginx"]
