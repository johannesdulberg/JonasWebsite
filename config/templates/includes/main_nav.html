{% load wagtailcore_tags %}
<ul class="flex flex-col items-center gap-y-4 md:flex-row md:gap-x-10">
    {% for item in items %}
    <li>
        <a href="{% pageurl item.page %}"
           class="text-sm uppercase tracking-wide transition-colors hover:text-accent {% if item.active %}text-accent{% endif %}"
           {% if item.active %}aria-current="page"{% endif %}>{{ item.page.title }}</a>
    </li>
    {% endfor %}
</ul>
