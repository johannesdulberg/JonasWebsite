{% load wagtailcore_tags %}
{# Der Termin-Knopf ist der letzte Menüpunkt: am Desktop in der Zeile, auf dem Handy breit unter der Liste. #}
<ul class="flex flex-col gap-y-5 md:flex-row md:flex-wrap md:items-center md:justify-center md:gap-x-10 md:gap-y-3">
    {% for item in items %}
    <li>
        <a href="{% pageurl item.page %}"
           class="text-base uppercase tracking-wide transition-colors hover:text-accent md:text-sm {% if item.active %}text-accent{% endif %}"
           {% if item.active %}aria-current="page"{% endif %}>{{ item.page.title }}</a>
    </li>
    {% endfor %}
    {% if booking %}
    <li class="mt-3 md:mt-0">
        <a href="{% pageurl booking %}" data-booking-button
           class="block rounded-md border border-accent py-3.5 text-center font-medium transition-colors md:whitespace-nowrap md:rounded-full md:px-5 md:py-2 md:text-sm {% if booking_active %}text-accent hover:bg-accent hover:text-paper{% else %}bg-accent text-paper hover:opacity-90{% endif %}"
           {% if booking_active %}aria-current="page"{% endif %}>{{ booking_text }}</a>
    </li>
    {% endif %}
</ul>
