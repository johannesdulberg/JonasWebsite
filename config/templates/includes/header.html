{% load core_tags %}
{% with site_settings=settings.core.SiteSettings %}
<header>
    <div class="mx-auto flex max-w-screen-2xl flex-col items-center px-5 pb-6 pt-8 text-center md:px-10 md:pt-9">
        <a href="/" class="block">
            <span class="block font-display text-2xl font-extrabold uppercase leading-none tracking-[0.2em] sm:text-3xl">{{ site_settings.brand_name }}</span>
            {% if site_settings.tagline %}
            <span class="mt-2 block text-xs tracking-[0.25em] sm:text-sm">{{ site_settings.tagline }}</span>
            {% endif %}
        </a>

        {# Nur auf schmalen Bildschirmen sichtbar. Das Auf- und Zuklappen macht site.js. #}
        <button type="button" data-nav-toggle aria-controls="main-nav" aria-expanded="false"
                class="mt-5 px-3 py-2 text-sm uppercase tracking-wide md:hidden">Menü</button>

        <nav id="main-nav" aria-label="Hauptnavigation" class="hidden pt-3 md:block md:pt-7">
            {% main_nav %}
        </nav>
    </div>
</header>
{% endwith %}
